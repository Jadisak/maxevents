<!DOCTYPE html>
<html>
<head>
  <title>E-Ticket Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans Thai', sans-serif;
      }
    </style>
</head>
<body class="flex flex-col mx-auto bg-[url('qr-01.jpeg')] bg-no-repeat bg-cover bg-top h-screen">
  <div class="bg-black/30 w-full h-screen absolute -z-10 xbackdrop-blur-sm"></div>
  <div class="w-full bg-gradient-to-b from-lime-500/80 pt-4">
    <h1 class="font-thin text-2xl sm:text-3xl text-center text-white">ระบบลงทะเบียน <span class="font-semibold text-4xl">eTickets</span></h1>
    <p class="text-center font-semibold text-lime-300 text-lg py-1">
      MAX-Events Register App</p>
  </div>
  <div class="mx-auto sm:w-[720px] py-6 sm:flex">
    <div class="w-full place-items-center text-whitex sm:block hidden bg-[url('qr-02.jpeg')] bg-cover bg-center overflow-hidden rounded-l-2xl relative">
      <div class="bg-gradient-to-t from-lime-600 w-full h-1/3 absolute bottom-0 left-0"></div>
      <div class="pl-5 pr-8 pb-2 w-fit bottom-0 rounded-tr-[80%] absolute">
        <p class="mx-auto w-full text-lg text-white font-extralight drop-shadow">
          <div class="flex items-center gap-2">
            <h1 class="font-semibold text-3xl text-white">eTickets</h1>
            <div class="w-12 h-0.5 bg-yellow-300"></div>
          </div>
          <p class="text-white font-extralight leading-5">ระบบออกบัตรสำหรับอีเว้นท์ทุกขนาด</p>
          <p class="text-white font-extralight leading-5">ลดภาระงาน ประหยัด ปลอดภัย</p>
        </p>
      </div>
    </div>
    <div class="p-6 bg-green-200/80 h-fit sm:rounded-r-2xl">
      <form method="post" action="https://script.google.com/macros/s/AKfycbwKD4EJHry2m5sUdB_l_yfF2ZVWnexxQ-8-uMQ9A84ndwGRU9HhnRWHugTJsUvMduwuAw/exec" class="w-[80vw] sm:w-[320px] text-green-800 font-extralight text-xl">
        <label for="name">ชื่อ-นามสกุล</label><br>
        <input type="text" id="name" name="name" class="w-full p-1 rounded my-2 shadow"><br>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" class="w-full p-1 rounded my-2 shadow"><br>
        <label for="phone">โทรศัพท์</label><br>
        <input type="phone" id="phone" name="phone" class="w-full p-1 rounded my-2 shadow"><br>
        <label for="message">รหัสสมาชิก</label><br>
        <input id="message" name="message" class="w-full p-1 rounded my-2 shadow"></input><br>
        <input type="submit" value="ขอรับบัตร" class="px-5 py-2 w-full mx-auto bg-teal-700 text-white hover:bg-teal-500 duration-500 mt-3 shadow">
      </form>
    </div>
  </div>
  <!-- Footer -->
  <footer>
    <p class="absolute bottom-0 text-center text-lime-400 bg-teal-700/50 text-xs px-6 py-3 rounded-tr-xl">© 2024 MAX-Events</p>
  </footer>
  
</body>
</html>
